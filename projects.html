<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Adeep AG</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&family=Poppins:wght@600;700;800&family=Archivo+Black&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">

<style>
  @font-face {
    font-family: 'Hey Gotcha';
    src: url('fonts/HeyGotcha-Regular.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'Horiza';
    src: url('fonts/Horizon.woff2') format('woff2'),
         url('fonts/Horizon.otf') format('opentype');
    font-display: swap;
  }

  :root{
    --bg: #ffffff;
    --text: #000000;
    --text-body: #333333;
    --text-muted: #666666;
    --border: #000000;
    --accent: #2788c7;
    --card-bg: #ffffff;
    --thumb-bg: #f2f2f2;
  }
  html.dark{
    --bg: #14171a;
    --text: #f2f2f2;
    --text-body: #cfcfcf;
    --text-muted: #9aa0a6;
    --border: #f2f2f2;
    --accent: #5fb3ec;
    --card-bg: #1b1f23;
    --thumb-bg: #23272b;
  }

  * { box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--bg);
    color: var(--text);
    padding: 0 0 80px;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .theme-toggle{
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 30;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border: 2px solid var(--border);
    border-radius: 50%;
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
  }
  .theme-toggle:hover{ opacity: 0.8; }
  .theme-toggle svg{ width: 19px; height: 19px; fill: currentColor; }

  .top-bar{
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 24px 0;
  }
  .back-link{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Comic Sans MS', 'Comic Sans', 'Comic Neue', sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: var(--accent);
    text-decoration: none;
  }
  .back-link:hover{ opacity: 0.75; }
  .back-link:focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; }
  .back-link svg{ width: 18px; height: 18px; }

  .page-heading{
    text-align: center;
    font-family: 'Horiza', 'Archivo Black', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 49.334px);
    margin: 18px 0 36px;
  }

  .project-grid{
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
  }

  .project-card{
    display: block;
    text-decoration: none;
    color: inherit;
    border: 3px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    background: var(--card-bg);
    box-shadow: 6px 6px 0 var(--border);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
  }
  .project-card:hover,
  .project-card:focus-visible{
    transform: translate(-3px, -3px);
    box-shadow: 9px 9px 0 var(--border);
    outline: none;
  }

  .project-thumb{
    width: 100%;
    aspect-ratio: 4 / 3;
    background: var(--thumb-bg);
    overflow: hidden;
  }
  .project-thumb img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .project-info{
    padding: 16px 18px 20px;
  }
  .project-name{
    font-family: 'Comic Sans MS', 'Comic Sans', 'Comic Neue', sans-serif;
    font-weight: 700;
    font-size: 20px;
    margin: 0 0 8px;
  }
  .project-desc{
    font-family: 'Comic Sans MS', 'Comic Sans', 'Comic Neue', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    color: var(--text-body);
    margin: 0;
  }

  @media (max-width: 900px){
    .project-grid{ grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 560px){
    .project-grid{ grid-template-columns: 1fr; }
    .page-heading{ font-size: 30px; }
  }
</style>
</head>
<body>

  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
    <svg id="themeIcon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
  </button>

  <div class="top-bar">
    <a href="index.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"></path>
        <path d="M12 19l-7-7 7-7"></path>
      </svg>
      Back
    </a>
  </div>

  <h1 class="page-heading">MY PROJECTS :</h1>

  <div class="project-grid">

    <a href="projects/alogin.html" class="project-card">
      <div class="project-thumb">
        <img src="images/alogin.png" alt="ALogin project thumbnail">
      </div>
      <div class="project-info">
        <p class="project-name">ALogin</p>
        <p class="project-desc">A lightweight authentication library built for fast, secure login flows.</p>
      </div>
    </a>

    <a href="projects/rcsvitcloud.html" class="project-card">
      <div class="project-thumb">
        <img src="images/rcsvitcloud.png" alt="RCSVITCloud project thumbnail">
      </div>
      <div class="project-info">
        <p class="project-name">RCSVITCloud</p>
        <p class="project-desc">A cloud-based media and file sharing platform built for RCSVIT.</p>
      </div>
    </a>

    <a href="projects/trackstop.html" class="project-card">
      <div class="project-thumb">
        <img src="images/trackstop.png" alt="Trackstop project thumbnail">
      </div>
      <div class="project-info">
        <p class="project-name">Trackstop</p>
        <p class="project-desc">An RFID/NFC-based transit tracking system combining hardware and backend.</p>
      </div>
    </a>

  </div>
  <script>
    const root = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');

    function setTheme(mode){
      if(mode === 'dark'){
        root.classList.add('dark');
        themeIcon.innerHTML = '<path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 10.5v2h3v-2h-3zm-8-5a5 5 0 100 10 5 5 0 000-10zm-1 16.95h2V19.5h-2v2.95zm-7.45-3.91l1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"/>';
      } else {
        root.classList.remove('dark');
        themeIcon.innerHTML = '<path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>';
      }
      localStorage.setItem('site-theme', mode);
    }

    const savedTheme = localStorage.getItem('site-theme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    setTheme(savedTheme);

    themeToggle.addEventListener('click', () => {
      setTheme(root.classList.contains('dark') ? 'light' : 'dark');
    });
  </script>

</body>
</html>
