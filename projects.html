<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Adeep AG</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&family=Poppins:wght@600;700;800&family=Archivo+Black&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">

<style>
  @font-face {
    font-family: 'Hey Gotcha';
    src: url('fonts/HeyGotcha-Regular.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'Horiza';
    src: url('fonts/Horizon.woff2') format('woff2'),
         url('fonts/Horizon.otf') format('opentype');
    font-display: swap;
  }

  * { box-sizing: border-box; }

  body{
    margin: 0;
    background: #ffffff;
    color: #000;
    padding: 0 0 80px;
  }

  .top-bar{
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 24px 0;
  }
  .back-link{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Comic Sans MS', 'Comic Sans', 'Comic Neue', sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: #2788c7;
    text-decoration: none;
  }
  .back-link:hover{ opacity: 0.75; }
  .back-link:focus-visible{ outline: 2px solid #2788c7; outline-offset: 3px; }
  .back-link svg{ width: 18px; height: 18px; }

  .page-heading{
    text-align: center;
    font-family: 'Horiza', 'Archivo Black', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 49.334px);
    margin: 18px 0 36px;
  }

  .project-grid{
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
  }

  .project-card{
    display: block;
    text-decoration: none;
    color: inherit;
    border: 3px solid #000;
    border-radius: 14px;
    overflow: hidden;
    background: #fff;
    box-shadow: 6px 6px 0 #000;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .project-card:hover,
  .project-card:focus-visible{
    transform: translate(-3px, -3px);
    box-shadow: 9px 9px 0 #000;
    outline: none;
  }

  .project-thumb{
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #f2f2f2;
    overflow: hidden;
  }
  .project-thumb img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .project-info{
    padding: 16px 18px 20px;
  }
  .project-name{
    font-family: 'Comic Sans MS', 'Comic Sans', 'Comic Neue', sans-serif;
    font-weight: 700;
    font-size: 20px;
    margin: 0 0 8px;
  }
  .project-desc{
    font-family: 'Comic Sans MS', 'Comic Sans', 'Comic Neue', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    color: #333;
    margin: 0;
  }

  @media (max-width: 900px){
    .project-grid{ grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 560px){
    .project-grid{ grid-template-columns: 1fr; }
    .page-heading{ font-size: 30px; }
  }
</style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"></path>
        <path d="M12 19l-7-7 7-7"></path>
      </svg>
      Back
    </a>
  </div>

  <h1 class="page-heading">MY PROJECTS :</h1>

  <div class="project-grid">

    <a href="projects/alogin.html" class="project-card">
      <div class="project-thumb">
        <img src="images/alogin.png" alt="ALogin project thumbnail">
      </div>
      <div class="project-info">
        <p class="project-name">ALogin</p>
        <p class="project-desc">A lightweight authentication library built for fast, secure login flows.</p>
      </div>
    </a>

    <a href="projects/rcsvitcloud.html" class="project-card">
      <div class="project-thumb">
        <img src="images/rcsvitcloud.png" alt="RCSVITCloud project thumbnail">
      </div>
      <div class="project-info">
        <p class="project-name">RCSVITCloud</p>
        <p class="project-desc">A cloud-based media and file sharing platform built for RCSVIT.</p>
      </div>
    </a>

    <a href="projects/trackstop.html" class="project-card">
      <div class="project-thumb">
        <img src="images/trackstop.png" alt="Trackstop project thumbnail">
      </div>
      <div class="project-info">
        <p class="project-name">Trackstop</p>
        <p class="project-desc">An RFID/NFC-based transit tracking system combining hardware and backend.</p>
      </div>
    </a>

  </div>

</body>
</html>
