<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | Adeep AG</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&family=Comic+Neue:wght@400;700&family=Archivo+Black&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }

  html, body{
    margin: 0;
    height: 100%;
  }

  body{
    background: #ffffff;
    color: #000;
    font-family: 'Comic Sans MS', 'Comic Sans', 'Comic Neue', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .wrap{
    max-width: 560px;
    text-align: center;
  }

  .code{
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(90px, 22vw, 160px);
    line-height: 1;
    margin: 0;
    letter-spacing: 2px;
  }
  .code .zero{
    display: inline-block;
    transform: rotate(-6deg);
    color: #2788c7;
  }

  .robot{
    width: 160px;
    margin: 0 auto 8px;
    display: block;
  }

  .title{
    font-family: 'Horiza', 'Archivo Black', sans-serif;
    font-weight: 700;
    font-size: clamp(22px, 4vw, 30px);
    margin: 8px 0 10px;
  }

  .subtitle{
    font-size: 17px;
    line-height: 1.6;
    color: #444;
    margin: 0 0 30px;
  }
  .subtitle code{
    background: #f2f2f2;
    border: 1px solid #ddd;
    border-radius: 5px;
    padding: 1px 7px;
    font-family: 'Courier New', monospace;
    font-size: 14px;
  }

  .btn{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #2788c7;
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 16px;
    padding: 12px 22px;
    border: 3px solid #000;
    border-radius: 10px;
    box-shadow: 5px 5px 0 #000;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover{
    transform: translate(-2px, -2px);
    box-shadow: 7px 7px 0 #000;
  }
  .btn svg{ width: 18px; height: 18px; }

  @media (max-width: 480px){
    .code{ font-size: 80px; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <svg class="robot" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- floating question marks -->
      <text x="8" y="30" font-family="Comic Sans MS, sans-serif" font-weight="700" font-size="22" fill="#2788c7" transform="rotate(-12 8 30)">?</text>
      <text x="115" y="22" font-family="Comic Sans MS, sans-serif" font-weight="700" font-size="16" fill="#e63946" transform="rotate(10 115 22)">?</text>

      <!-- body, tilted like it's confused -->
      <g transform="rotate(-8 70 85)">
        <rect x="40" y="60" width="60" height="45" rx="8" fill="#ffd23f" stroke="#000" stroke-width="3"/>
        <rect x="52" y="35" width="36" height="30" rx="6" fill="#fff" stroke="#000" stroke-width="3"/>

        <!-- wobbly antenna -->
        <path d="M70 35 Q66 27 71 20" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="71.5" cy="18" r="4.5" fill="#e63946" stroke="#000" stroke-width="2"/>

        <!-- mismatched / dizzy eyes -->
        <circle cx="62" cy="49" r="5" fill="#000"/>
        <circle cx="63.5" cy="47.5" r="1.6" fill="#fff"/>
        <path d="M74 45 L80 51 M80 45 L74 51" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>

        <!-- confused wavy mouth -->
        <path d="M60 57 Q64 60 68 57 Q72 54 76 57" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>

        <!-- arms up in a shrug -->
        <path d="M40 72 Q26 68 22 78" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>
        <circle cx="21" cy="80" r="6" fill="#e63946" stroke="#000" stroke-width="2.5"/>
        <path d="M100 72 Q114 68 118 78" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>
        <circle cx="119" cy="80" r="6" fill="#e63946" stroke="#000" stroke-width="2.5"/>

        <!-- legs -->
        <circle cx="55" cy="112" r="11" fill="#222" stroke="#000" stroke-width="2.5"/>
        <circle cx="85" cy="112" r="11" fill="#222" stroke="#000" stroke-width="2.5"/>

        <!-- chest panel -->
        <rect x="50" y="72" width="14" height="14" rx="3" fill="#2788c7" stroke="#000" stroke-width="2"/>
        <rect x="74" y="72" width="14" height="14" rx="3" fill="#2788c7" stroke="#000" stroke-width="2"/>
      </g>

      <!-- little "lost" swirl lines above head -->
      <path d="M55 12 Q60 6 66 10" stroke="#666" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
      <path d="M88 15 Q94 10 98 15" stroke="#666" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    </svg>

    <p class="code"><span>4</span><span class="zero">0</span><span>4</span></p>
    <h1 class="title">Uh oh — this page went off the grid.</h1>
    <p class="subtitle">
      The page you're looking for doesn't exist, moved, or the URL has a typo.
      Might be a broken <code>&lt;a href&gt;</code> somewhere — but no worries, let's get you back on track.
    </p>

    <a href="/index.html" class="btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11.5L12 4l9 7.5"></path>
        <path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"></path>
      </svg>
      Back to Home
    </a>
  </div>

</body>
</html>
