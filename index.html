<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Adeep AG</title>

<!-- Abhaya Libre Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;
}

.box{

    width:min(850px,90%);
    padding:70px 50px;

    border:1px solid rgba(255,255,255,.35);
    border-radius:28px;

    text-align:center;

    background:#000;

    box-shadow:
    0 0 20px rgba(255,255,255,.04),
    inset 0 0 25px rgba(255,255,255,.02);

}

h1{

    font-family:"Abhaya Libre", serif;
    font-size:72px;
    font-weight:800;
    letter-spacing:8px;

}

h2{

    margin-top:12px;

    font-family:"Abhaya Libre", serif;
    font-size:34px;
    font-weight:700;
    letter-spacing:5px;

}

p{

    margin-top:40px;

    font-family:"Abhaya Libre", serif;
    font-size:26px;

    letter-spacing:3px;

    opacity:.85;

}

@media(max-width:768px){

h1{
font-size:46px;
letter-spacing:4px;
}

h2{
font-size:24px;
}

p{
font-size:18px;
letter-spacing:1px;
}

.box{
padding:50px 25px;
}

}

</style>

</head>

<body>

<div class="box">

<h1>WEBSITE</h1>

<h2>COMING</h2>

<p>VERRY VERYY SOOOOOOOON :)</p>

</div>

</body>
</html>
