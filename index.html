<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adeep AG</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&family=Poppins:wght@600;700;800&family=Archivo+Black&display=swap" rel="stylesheet">

<style>
  @font-face {
    font-family: 'Hey Gotcha';
    src: url('fonts/HeyGotcha-Regular.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'Horiza';
    src: url('fonts/Horizon.woff2') format('woff2'),
         url('fonts/Horizon.otf') format('opentype');
    font-display: swap;
  }

  * { box-sizing: border-box; }

  body{
    margin: 0;
    background: #ffffff;
    color: #000;
    padding: 0 0 80px;
  }

  /*
    This block reproduces the original Canva canvas (1366 x 768) at
    exact scale. Every element below uses the real top/left/width/
    font-size values pulled from the Canva page data, expressed as
    cqw (percent of the canvas's own width). Because the canvas keeps
    a fixed 1366:768 aspect ratio, using cqw for BOTH horizontal and
    vertical values keeps everything perfectly proportional at any
    screen size -- it scales exactly like the original, just smaller
    or larger as a whole.
  */
  .canvas{
    container-type: inline-size;
    position: relative;
    width: 100%;
    max-width: 1366px;
    margin: 0 auto;
    aspect-ratio: 1366 / 768;
    background: #ffffff;
  }

  .el{
    position: absolute;
  }

  .logo{
    top: 0.814cqw;
    left: 1.937cqw;
    width: 26.77cqw;
    font-family: 'Arvo', serif;
    font-weight: 700;
    font-size: clamp(20px, 4.978cqw, 68px);
    line-height: 1.1;
    text-align: center;
    margin: 0;
  }

  nav a{
    position: absolute;
    top: 4.163cqw;
    font-family: 'Hey Gotcha', 'Poppins', sans-serif;
    font-weight: 700;
    font-size: clamp(11px, 2.05cqw, 28px);
    color: #2788c7;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  nav a:hover{ opacity: 0.75; }
  nav a:focus-visible{ outline: 2px solid #2788c7; outline-offset: 3px; }

  .nav-projects{ left: 32.29cqw; }
  .nav-blog{     left: 42.97cqw; }
  .nav-contact{  left: 49.92cqw; }
  .nav-more{     left: 60.42cqw; }

  .feature-image{
    top: 10.65cqw;
    left: 28.71cqw;
    width: 37.48cqw;
    margin: 0;
  }
  .feature-image img{
    display: block;
    width: 100%;
    height: auto;
  }
  .about-heading{
    top: 25.95cqw;
    left: 34.99cqw;
    width: 31.20cqw;
    font-family: 'Horiza', 'Archivo Black', sans-serif;
    font-weight: 700;
    font-size: clamp(18px, 3.612cqw, 49.334px);
    text-align: center;
    margin: 0;
  }

  .about-body-wrap{
    max-width: 640px;
    margin: 24px auto 0;
    padding: 0 24px;
  }
  .about-body{
    font-family: 'Poppins', sans-serif;
    font-size: 16px;
    line-height: 1.7;
    color: #333;
  }
</style>
</head>
<body>

  <div class="canvas">
    <p class="logo el">ADEEP AG</p>

    <nav>
      <a href="#projects" class="nav-projects">Projects</a>
      <a href="#blog" class="nav-blog">Blog</a>
      <a href="#contact" class="nav-contact">Contact</a>
      <a href="#more" class="nav-more">More</a>
    </nav>

    <figure class="feature-image el">
      <img src="images/arjun-mbt.png" alt="Side profile illustration of the DRDO Arjun Main Battle Tank">
    </figure>
    <figcaption class="el" style="top:22.86cqw; left:36.27cqw; width:27.72cqw; font-family:'Poppins', sans-serif; font-size: clamp(9px, 0.878cqw, 12px); text-align:center; color:#000;">DRDO Arjun MBT</figcaption>

    <h2 class="about-heading el">ABOUT ME :</h2>
  </div>

  <div class="about-body-wrap">
    <p class="about-body">
      Add your intro here — who you are, what you're building, and what
      you're into. Replace this paragraph with your own text.
    </p>
  </div>

</body>
</html>
