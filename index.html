<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adeep AG</title>

<!-- Arvo is a real Google Font, loaded directly -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&family=Poppins:wght@600;700;800&family=Archivo+Black&display=swap" rel="stylesheet">

<style>
  @font-face {
    font-family: 'Hey Gotcha';
    src: url('fonts/HeyGotcha-Regular.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'Horiza';
    src: url('fonts/Horizon.woff2') format('woff2'),
         url('fonts/Horizon.otf') format('opentype');
    font-display: swap;
  }

  :root{
    --nav-blue: #2f6fa8;
    --ink: #111111;
    --caption-gray: #4d4d4d;
    --col-gap: 48px;
  }

  * { box-sizing: border-box; }

  body{
    margin: 0;
    background: #ffffff;
    color: var(--ink);
    padding: 40px 60px 120px;
  }

  /*
    Two-column grid for the whole page: a narrow left column that
    holds ONLY the logo, and a right column that holds the nav,
    the image, and the About Me block. Because nav/image/heading
    all live in the same right column, their left edges line up
    with each other automatically -- matching the reference layout --
    while the logo stays isolated flush against the page's left edge.
  */
  .page{
    display: grid;
    grid-template-columns: max-content 1fr;
    column-gap: var(--col-gap);
    row-gap: 40px;
    align-items: start;
  }

  .logo{
    grid-column: 1;
    grid-row: 1;
    font-family: 'Arvo', serif;
    font-weight: 700;
    font-size: 51px;
    line-height: 1;
    letter-spacing: 1px;
    margin: 0;
    white-space: nowrap;
  }

  nav{
    grid-column: 2;
    grid-row: 1;
    display: flex;
    align-items: baseline;
    gap: 42px;
    flex-wrap: wrap;
    align-self: baseline;
  }

  nav a{
    font-family: 'Hey Gotcha', 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 21px;
    color: var(--nav-blue);
    text-decoration: underline;
    text-underline-offset: 4px;
    letter-spacing: 0.5px;
  }

  nav a:hover{ opacity: 0.75; }
  nav a:focus-visible{ outline: 2px solid var(--nav-blue); outline-offset: 3px; }

  main{
    grid-column: 2;
    grid-row: 2;
    max-width: 640px;
  }

  .feature-image{
    text-align: center;
    margin: 0 0 0 0;
  }

  .feature-image img{
    max-width: 100%;
    height: auto;
    width: 520px;
  }

  .feature-image figcaption{
    margin-top: 8px;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    color: var(--caption-gray);
  }

  .about-heading{
    font-family: 'Horiza', 'Archivo Black', sans-serif;
    font-weight: 700;
    font-size: 37px;
    letter-spacing: 1px;
    margin: 70px 0 24px;
  }

  .about-body{
    font-family: 'Poppins', sans-serif;
    font-size: 16px;
    line-height: 1.7;
    color: #333;
  }

  @media (max-width: 640px){
    body{ padding: 24px 20px 80px; }
    .page{ grid-template-columns: 1fr; row-gap: 18px; }
    .logo{ grid-column: 1; grid-row: 1; font-size: 38px; }
    nav{ grid-column: 1; grid-row: 2; gap: 24px; }
    nav a{ font-size: 18px; }
    main{ grid-column: 1; grid-row: 3; max-width: 100%; }
    .about-heading{ font-size: 28px; margin-top: 48px; }
  }
</style>
</head>
<body>

  <div class="page">
    <p class="logo">ADEEP AG</p>
    <nav>
      <a href="#projects">PROJECTS</a>
      <a href="#blog">BLOG</a>
      <a href="#contact">CONTACT</a>
      <a href="#more">MORE</a>
    </nav>

    <main>
      <figure class="feature-image">
        <img src="images/arjun-mbt.png" alt="Side profile illustration of the DRDO Arjun Main Battle Tank">
        <figcaption>DRDO Arjun MBT</figcaption>
      </figure>

      <h2 class="about-heading">ABOUT ME :</h2>
      <p class="about-body">
        Add your intro here — who you are, what you're building, and what
        you're into. Replace this paragraph with your own text.
      </p>
    </main>
  </div>

</body>
</html>
